[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "academic-hybrid-rewriter"
version = "0.1.0"
description = "Milestone prototype for academic text revision with Transformer and Mamba"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "transformers==4.44.2", "tokenizers>=0.19,<0.20", "numpy<2"]

[project.optional-dependencies]
analysis = ["matplotlib>=3.7"]
evaluation = ["sacrebleu==2.5.1", "bert-score==0.3.13", "sentencepiece==0.2.0"]
official = ["mamba-ssm"]

[tool.setuptools.packages.find]
where = ["src"]
