[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "academic-hybrid-rewriter"
version = "0.1.0"
description = "Six-layer academic rewriter with LSTM, Transformer and Mamba blocks"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "transformers==4.44.2", "tokenizers>=0.19,<0.20", "numpy<2"]

[project.optional-dependencies]
evaluation = ["sacrebleu==2.5.1"]

[tool.setuptools.packages.find]
where = ["src"]
